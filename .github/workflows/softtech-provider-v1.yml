name: Soft Tech native provider qualification
on:
  push:
    branches: [feat/softtech-provider-v1-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify checked-in approved engine sources
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          lock=json.loads(pathlib.Path('SOFTTECH_PROVIDER_SOURCE_LOCK.json').read_text())
          for name,expected in lock['sha256'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          print('PASS: checked-in math/art source lock; no archive extraction or source rewrite')
          PY
      - name: Install native test dependencies
        run: pip install -r requirements.txt pytest httpx Pillow
      - name: Native identity, recovery, accounting and math regression tests
        run: python -m pytest -q tests/test_native_backup.py tests/test_native_backup_streaming.py tests/test_native_backup_status.py tests/test_provider_isolation.py tests/test_native_dr.py tests/test_native_retention.py tests/test_native_concurrency.py tests/test_agency_native.py tests/test_game_engine.py tests/test_math_validation.py
