name: Staging security smoke
# Fixed, bounded requests against isolated synthetic-credit staging only.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-http-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated staging access controls and service readiness
        run: python tools/qa_security_staging_20261124.py
