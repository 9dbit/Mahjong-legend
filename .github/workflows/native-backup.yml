name: Native backup verification
on:
  push:
    branches: [feat/softtech-provider-v1-20261109]
    paths: ['tools/native_backup*.py', tools/native_retention.py, tools/benchmark_native_backup_memory.py, 'tests/test_native_backup*.py', tests/fixtures/native-backup-cryptography47.json, agency_runtime.py, Dockerfile, requirements.txt, .github/workflows/native-backup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_native_backup.py tests/test_native_backup_streaming.py tests/test_native_backup_status.py
