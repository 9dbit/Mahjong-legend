name: Test Mahjong Wild
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image QA dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Run math, API and asset tests
        run: python -m unittest discover -s tests -q
