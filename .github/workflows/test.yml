name: Verify Released UI Paint
on:
  push:
    branches: [test/v082-live-paint-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install 'Pillow>=10,<13' 'playwright==1.57.0'
      - name: Reproduce exact already released runtime assets
        run: python tools/build_locked_ui.py && python tools/build_presentation_fx.py && python tools/build_approved_ui.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify released files, complete tile decoding, final board and replay
        env:
          MW_LIVE_URL: https://mahjong-legend-web-production.up.railway.app
        run: python tools/qa_live_release.py
      - name: Save live screenshot and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-wild-v082-live-painted-board
          path: qa/
