name: Approved UI Source Transfer
on:
  push:
    branches: [release/approved-pwa-v082]
    paths: [.github/workflows/approved-ui-transfer.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/approved-pwa-v082
      - name: Import checksum-verified approved source bundle
        env:
          BUNDLE_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-511c-8207-824d-e9b09928099f/raw?se=2026-10-24T14%3A21%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=d4955b16-0e42-50b8-a407-dce5baec963d&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-24T06%3A02%3A25Z&ske=2026-10-25T06%3A02%3A25Z&sks=b&skv=2026-02-06&sig=9eQyr/%2BdlTpZkhcUqGZuATSIgtVAJlgz0lNY8y11psU%3D'
        run: |
          echo "::add-mask::$BUNDLE_URL"
          curl --fail --silent --show-error --location --max-time 60 "$BUNDLE_URL" -o /tmp/approved-ui.zip
          python - <<'PY'
          import hashlib, zipfile, pathlib, json
          p=pathlib.Path('/tmp/approved-ui.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='2d710905f22200f95f96d2a2940513484480593a6222da2b508ae05e284ad252'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert len(names)==97
              for name in names:
                  q=pathlib.PurePosixPath(name)
                  assert not q.is_absolute() and '..' not in q.parts
                  assert name.startswith(('web/','tools/','tests/','docs/')) or name in ('Dockerfile','mahjong_legend/server.py')
                  assert not name.startswith(('.git/','.github/'))
              z.extractall('.')
          pathlib.Path('/tmp/approved-paths.json').write_text(json.dumps(names))
          print('Imported 97 source/asset files; math engine and configuration untouched.')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test source
        run: |
          python -m pip install 'Pillow>=10,<13'
          python tools/build_locked_ui.py
          python tools/build_presentation_fx.py
          python tools/build_approved_ui.py
          python -m unittest discover -s tests -q
      - name: Commit only verified files to release branch
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          names=json.loads(Path('/tmp/approved-paths.json').read_text())
          subprocess.run(['git','add','--',*names],check=True)
          PY
          git config user.name 'Mahjong Wild Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: approved PWA artwork runtime, ceramic shatter, themed menus and soft music'
          git push origin HEAD:release/approved-pwa-v082
          git rev-parse HEAD
