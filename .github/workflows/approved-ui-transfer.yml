name: Approved UI Source Transfer
on:
  push:
    branches: [release/approved-pwa-v082]
    paths: [.github/workflows/approved-ui-transfer.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package current source
        run: git archive --format=zip HEAD -o /tmp/mahjong-current-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mahjong-current-source
          path: /tmp/mahjong-current-source.zip
          retention-days: 2
