name: Soft Tech provider runtime
on:
  push:
    branches: [feat/softtech-provider-v1-20261109]
    paths: ['.github/workflows/softtech-provider-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply provider-neutral transport identity without touching game math
        run: |
          python - <<'PY'
          import pathlib,hashlib,json
          files=['agency_runtime.py','agency_wallet.py','agency-client.js','agency-navigation.js']
          expected='08bde22d157336872cdcfa4aaa77d3f056db150dfc0e432bdfaaf2275935ea8d'
          assert hashlib.sha256(pathlib.Path('mahjong_legend/engine.py').read_bytes()).hexdigest()==expected
          for name in files:
              p=pathlib.Path(name);s=p.read_text()
              s=s.replace('playground_launch','softtech_launch').replace('PlaygroundNavigation','SoftTechNavigation').replace('Playground','Soft Tech').replace("'wallet':'playground'","'wallet':'soft-tech'")
              if name=='agency_runtime.py':s=s.replace("return {'ok':True,'game':'Mahjong Wild'","return {'ok':True,'provider':'soft-tech','version':'provider-v1','game':'Mahjong Wild'")
              p.write_text(s)
          pathlib.Path('SOFTTECH_PROVIDER_SOURCE_LOCK.json').write_text(json.dumps({'base_commit':'d75ea42af04bbd027fecc64408f7cb52d1d4cfdf','sha256':{'mahjong_legend/engine.py':expected}},indent=2)+'\n')
          print('Exact original Mahjong engine preserved. Provider-neutral launch and health identity applied.')
          PY
          python -m compileall -q agency_runtime.py agency_wallet.py
          node --check agency-client.js
          node --check agency-navigation.js
      - name: Native accounting regression tests
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest -q tests/test_agency_native.py
      - name: Commit validated provider runtime
        run: |
          git add agency_runtime.py agency_wallet.py agency-client.js agency-navigation.js SOFTTECH_PROVIDER_SOURCE_LOCK.json
          git config user.name 'Soft Tech release validation'
          git config user.email '154832153+9dbit@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(provider): neutral Mahjong adapter, original math hash preserved'
            git push origin HEAD:feat/softtech-provider-v1-20261109
          fi
          git rev-parse HEAD
