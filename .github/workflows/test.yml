name: Test Mahjong Wild
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'Pillow==12.3.0' 'playwright==1.57.0'
      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build locked artwork and aligned light masks
        run: python tools/build_locked_ui.py && python tools/build_presentation_fx.py && python tools/build_approved_ui.py && python tools/build_portrait_ui.py && python tools/build_responsive_runtime.py && python tools/build_fullframe_ui.py
      - name: Run engine, HTTP and asset tests
        run: python -m unittest discover -s tests -q
      - name: Install Chromium and WebKit
        run: python -m playwright install --with-deps chromium webkit
      - name: Verify game in browser over HTTP
        run: python tools/qa_locked_ui.py
      - name: Verify motion, visible shatter and layout in Chromium
        run: python tools/qa_motion_v081.py
      - name: Verify motion, visible shatter and layout in WebKit
        run: python tools/qa_motion_v081.py --engine webkit
      - name: Verify approved menus audio and PWA
        run: python tools/qa_approved_v082.py && python tools/qa_approved_v082.py --engine webkit
      - name: Verify audio output gain and saved mute settings
        run: python tools/qa_audio_gain_v087.py --output qa/audio-v087/chromium.json && python tools/qa_audio_gain_v087.py --engine webkit --output qa/audio-v087/webkit.json
      - name: Verify GPU atlas no blank frames and left to right reels
        run: python tools/qa_reels_v083.py && python tools/qa_reels_v083.py --engine webkit
      - name: Verify portrait geometry and immediate input under network delay
        run: python tools/qa_portrait_v085.py && python tools/qa_portrait_v085.py --engine webkit
      - name: Verify full-frame portrait safe areas and viewport resize
        run: python tools/qa_fullframe_v086.py && python tools/qa_fullframe_v086.py --engine webkit
      - name: Verify continuous logo round lanterns and animated crown light
        run: python tools/qa_logo_v087.py && python tools/qa_logo_v087.py --engine webkit
      - name: Verify unified large controls
        run: python tools/qa_controls_v090.py && python tools/qa_controls_v090.py --engine webkit
      - name: Save browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-wild-v087-browser-qa
          path: qa/
      - name: Save generated asset pack
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-wild-v087-runtime-assets
          path: web/assets/
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: studio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://studio_test:isolated-ci-only@127.0.0.1:5432/studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: studio_ui/package-lock.json
      - name: Install application and verification dependencies
        run: python -m pip install -r requirements.txt 'playwright==1.57.0'
      - name: Install audio codecs
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build Studio
        working-directory: studio_ui
        run: npm ci && npm run build
      - name: Build complete versioned game runtime
        run: python tools/build_locked_ui.py && python tools/build_presentation_fx.py && python tools/build_approved_ui.py && python tools/build_portrait_ui.py && python tools/build_responsive_runtime.py --runtime-only && python tools/build_fullframe_ui.py --runtime-only && python tools/build_studio_runtime.py
      - name: Validate schema migrations
        run: python manage.py check && python manage.py makemigrations --check --dry-run
      - name: Verify PostgreSQL settlement, studio contracts and backup restore
        run: python manage.py test game_studio --verbosity 2
      - name: Verify actual media transforms and immutable storage
        run: python -m unittest discover -s tests -p test_studio_media.py -v
      - name: Install browser engines
        run: python -m playwright install --with-deps chromium webkit
      - name: Verify release-configured audio output
        run: python tools/qa_studio_audio_v090.py --output qa/studio-audio-chromium.json && python tools/qa_studio_audio_v090.py --engine webkit --output qa/studio-audio-webkit.json
      - name: Verify integrated engine and game in both browsers
        run: python tools/qa_studio_engine_v090.py && python tools/qa_studio_engine_v090.py --engine webkit
      - name: Verify complete Studio editing and publication workflow
        run: python studio_ui/qa_studio.py --engine chromium --output qa/studio-ui/chromium && python studio_ui/qa_studio.py --engine webkit --output qa/studio-ui/webkit
      - name: Verify exact production release on Railway
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          MW_LIVE_URL: https://mahjong-legend-web-production.up.railway.app
        run: python tools/qa_studio_live_v090.py
      - name: Save Studio verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-studio-v090-qa
          path: qa/
