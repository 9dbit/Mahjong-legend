name: Provider renderer compatibility
on:
  push:
    branches: [feat/softtech-provider-v1-20261109]
    paths: ['.github/workflows/provider-browser-compat.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Correct provider UI namespace without touching game math
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path('tools/build_studio_runtime.py');s=p.read_text()
          assert 'PlaygroundNavigation' in s
          s=s.replace('PlaygroundNavigation','SoftTechNavigation').replace("next.wallet==='playground'","next.wallet==='soft-tech'").replace('PLAYGROUND SANDBOX','SOFT TECH SANDBOX')
          p.write_text(s)
          lock=json.loads(pathlib.Path('SOFTTECH_PROVIDER_SOURCE_LOCK.json').read_text())
          for name,digest in lock['sha256'].items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          PY
          python -m compileall -q tools/build_studio_runtime.py
      - name: Validate native engine contract
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest -q tests/test_agency_native.py
      - name: Commit validated correction
        run: |
          git add tools/build_studio_runtime.py
          git config user.name 'Soft Tech release validation'
          git config user.email '154832153+9dbit@users.noreply.github.com'
          git commit -m 'fix(provider): generated Mahjong renderer uses Soft Tech session state'
          git push origin HEAD:feat/softtech-provider-v1-20261109
