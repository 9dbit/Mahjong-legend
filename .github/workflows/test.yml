name: Export baseline for full-frame repair
on: [push]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 63c69859238aa50c3089743d51d31ffa3bca5dbd
      - run: git archive --format=zip HEAD -o /tmp/mahjong-baseline.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mahjong-v085-baseline-source
          path: /tmp/mahjong-baseline.zip
          retention-days: 3
